function selectCar(i){selected=i;renderAssist();}
function cancelHint(){hintToken++;if(hintWorker){hintWorker.terminate();hintWorker=null;}clearTimeout(hintTimer);clearTimeout(hintTimeout);hint=null;$('hint-label').textContent='힌트';$('hint-button').classList.remove('busy');$('hint-button').disabled=won;}
function cancelDrag(){if(!drag)return;const d=drag;drag=null;const e=carEls[d.i];if(e){e.classList.remove('dragging');e.style.transform='';try{e.releasePointerCapture(d.id);}catch(_){}}}
function loadLevel(index,restored=null){
 cancelDrag();cancelHint();clearTimeout(winTimer);clearTimeout(clearTimer);closeSheet(false);
 levelIndex=Math.max(0,Math.min(LEVELS.length-1,index));positions=restored?restored.positions.slice():cars().map(c=>c[3]);history=restored?restored.history.map(p=>p.slice()):[];selected=-1;won=positions[0]===4;
 board.classList.remove('complete');renderCars();if(won){carEls[0].classList.add('escaped');board.classList.add('complete');}
 renderStatus();soundIcon();save();announce(`스테이지 ${levelIndex+1}, ${TITLES[levelIndex]}. 최소 ${LEVELS[levelIndex].par}회 이동.`);

function moveCar(i,to){
 if(won||!Number.isInteger(to))return false;
 const b=bounds(i);if(to<b.min||to>b.max||to===positions[i])return false;
 cancelHint();const previous=positions.slice();history.push(previous);positions[i]=to;selected=i;paintPosition(i);tone('move');

function undo(){if(won||!history.length)return;cancelDrag();cancelHint();positions=history.pop();selected=-1;carEls.forEach((_,i)=>paintPosition(i));renderStatus();save();tone('undo');announce(`되돌렸어요. 현재 ${history.length}회 이동.`);}

function onDown(event){

 try{e.focus({preventScroll:true});}catch(_){}
 const b=bounds(i);drag={i,id:event.pointerId,x:event.clientX,y:event.clientY,p:positions[i],min:b.min,max:b.max,delta:0,size:board.getBoundingClientRect().width/6};

}
function onMove(event){
 if(!drag||drag.id!==event.pointerId)return;event.preventDefault();const d=drag,h=cars()[d.i][0];const px=h?event.clientX-d.x:event.clientY-d.y;d.delta=Math.max((d.min-d.p)*d.size,Math.min((d.max-d.p)*d.size,px));

function onUp(event,cancel=false){
 if(!drag||drag.id!==event.pointerId)return;
 const d=drag;drag=null;const e=carEls[d.i];e.classList.remove('dragging');e.style.transform='';try{e.releasePointerCapture(d.id);}catch(_){}

// Breadth-first search counts any continuous slide as one move. Every included
// layout was independently verified to be solvable; hints solve the *current* state.
function createSearch(vs,start){
 const key=start.join(''),queue=[key],parent=[-1],actions=[null],seen=new Set([key]);let head=0,finished=false,result=null;
 function finish(at){const path=[];while(parent[at]>=0){path.push(actions[at]);at=parent[at];}result=path.reverse();finished=true;}
 function step(budget){
  if(finished)return {done:true,path:result,visited:seen.size};
  if(key[0]==='4'){finished=true;result=[];return {done:true,path:result,visited:1};}
  let count=0;
  while(head<queue.length&&count++<budget){
   const id=head++,s=queue[id],grid=new Int8Array(36);grid.fill(-1);
   for(let i=0;i<vs.length;i++){const [h,l,len]=vs[i],p=s.charCodeAt(i)-48;for(let k=0;k<len;k++)grid[h?l*6+p+k:(p+k)*6+l]=i;}
   for(let i=0;i<vs.length;i++){
    const [h,l,len]=vs[i],p=s.charCodeAt(i)-48;
    for(const dir of [-1,1]){
     for(let to=p+dir;to>=0&&to+len<=6;to+=dir){
      const edge=dir<0?to:to+len-1,cell=h?l*6+edge:edge*6+l;if(grid[cell]!==-1&&grid[cell]!==i)break;
      const next=s.slice(0,i)+String(to)+s.slice(i+1);if(seen.has(next))continue;
      seen.add(next);const at=queue.length;queue.push(next);parent.push(id);actions.push({i,to});
      if(next[0]==='4'){finish(at);return {done:true,path:result,visited:seen.size};}
      if(seen.size>200000){finished=true;return {done:true,path:null,visited:seen.size,error:'limit'};}
     }
    }
   }
  }
  if(head>=queue.length){finished=true;result=null;return {done:true,path:null,visited:seen.size};}
  return {done:false,visited:seen.size};
 }
 return {step};
}
function requestHint(){
 if(won||!$('modal').hidden)return;if(hint){toast('밝게 표시된 차를 움직여 보세요.');return;}
 cancelHint();const token=hintToken,start=positions.slice(),vs=cars().map(c=>c.slice());$('hint-button').disabled=true;$('hint-button').classList.add('busy');$('hint-label').textContent='길 찾는 중';
 let fallbackStarted=false;
 const done=result=>{
  if(token!==hintToken)return;if(hintWorker){hintWorker.terminate();hintWorker=null;}clearTimeout(hintTimeout);clearTimeout(hintTimer);$('hint-button').disabled=won;$('hint-button').classList.remove('busy');$('hint-label').textContent='힌트';
  if(encode(start)!==encode(positions))return;
  if(!result.path||!result.path.length){toast('힌트를 찾지 못했어요. 되돌리거나 다시 시작해 보세요.');return;}
  hint=result.path[0];selected=hint.i;renderAssist();tone('hint');announce($('assist-text').textContent);
 };
 const fallback=()=>{
  if(fallbackStarted||token!==hintToken)return;fallbackStarted=true;if(hintWorker){hintWorker.terminate();hintWorker=null;}const search=createSearch(vs,start);
  const tick=()=>{if(token!==hintToken)return;const result=search.step(300);if(result.done)done(result);else hintTimer=setTimeout(tick,0);};hintTimer=setTimeout(tick,0);
 };
 hintTimeout=setTimeout(()=>{if(token!==hintToken)return;cancelHint();renderAssist();toast('길 찾기가 오래 걸려 중단했어요. 다시 시도해 주세요.');},30000);
 try{
  if(!window.Worker)throw new Error('worker unavailable');
  const script=`const createSearch=${createSearch.toString()};onmessage=e=>{try{const search=createSearch(e.data.vs,e.data.start);let result;do{result=search.step(2000);}while(!result.done);postMessage(result);}catch(error){postMessage({error:String(error)});}};`;
  const url=URL.createObjectURL(new Blob([script],{type:'text/javascript'}));try{hintWorker=new Worker(url);}finally{URL.revokeObjectURL(url);}
  hintWorker.onmessage=e=>{if(e.data.error&&!e.data.done)fallback();else done(e.data);};hintWorker.onerror=e=>{e.preventDefault();fallback();};hintWorker.postMessage({vs,start});
 }catch(_){fallback();}
}
function openSheet(mode,html){

}
function sheetHead(title){return `<div class="sheet-head"><h2 id="sheet-title">${title}</h2><button class="close-button" data-action="close" aria-label="닫기">${svg('close')}</button></div>`;}
function showLevels(){
 let html=sheetHead('어느 길로 떠날까요?')+'<p class="sheet-subtitle">36개의 작은 도전. 원하는 스테이지부터 시작해도 좋아요.<br>기록과 진행 중인 퍼즐은 이 브라우저에 자동 저장돼요.</p>';
 for(let g=0;g<3;g++){
  html+=`<section class="level-group"><h3>${['01 · 가벼운 출발','02 · 생각이 필요한 길','03 · 출구의 달인'][g]}<span>${['입문','도전','고수'][g]}</span></h3><div class="level-grid">`;
  for(let i=g*12;i<(g+1)*12;i++){
   const best=records[i],stars=best?starsFor(best,LEVELS[i].par):0;
   html+=`<button class="level-tile${i===levelIndex?' current':''}" data-level="${i}" aria-label="스테이지 ${i+1}, ${TITLES[i]}, 최소 ${LEVELS[i].par}회${best?`, 최고 ${best}회, 별 ${stars}개`:''}" ${i===levelIndex?'aria-current="true"':''}><strong>${String(i+1).padStart(2,'0')}</strong>${best?`<small class="tile-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</small>`:`<small>최소 ${LEVELS[i].par}회</small>`}</button>`;
  }html+='</div></section>';
 }
 openSheet('levels',html);
}
function showHelp(){openSheet('help',sheetHead('한 칸씩, 길을 열어요')+`
 <div class="rule"><span class="rule-num">1</span><div><h3>빨간 차를 오른쪽 출구로</h3><p>다른 차들을 비켜 세우고 빨간 차를 오른쪽 끝까지 밀면 탈출 성공이에요.</p></div></div>
 <div class="rule"><span class="rule-num">2</span><div><h3>차량은 길이 방향으로만</h3><p>가로 차는 좌우로, 세로 차는 위아래로 움직여요. 다른 차를 뛰어넘거나 회전할 수 없어요.</p></div></div>
 <div class="rule"><span class="rule-num">3</span><div><h3>길게 밀어도 1회 이동</h3><p>한 차를 한 번에 여러 칸 밀어도 1회예요. ‘최소 이동’에 맞춰 풀면 별 3개! 별은 이동 횟수로만 계산해요.</p></div></div>
 <div class="rule"><span class="rule-num">4</span><div><h3>막혔을 땐, 부담 없이 힌트</h3><p>현재 배치에서 다음 수를 알려 줘요. 힌트 사용으로 별이 줄지 않아요. 되돌리기는 횟수 제한이 없어요.</p></div></div>
 <div class="help-note">차를 탭한 뒤 아래 화살표로 한 칸씩 이동할 수도 있어요. 키보드에서는 Tab으로 차를 선택하고 방향키를 사용하세요.<br><br>기록은 같은 브라우저에 저장돼요. 비공개 브라우징, 사이트 데이터 삭제 또는 저장 공간 정리로 사라질 수 있어요. 다른 기기와 동기화하지 않아요.</div>
 <button class="primary" data-action="close" style="margin-top:20px">길을 열어 볼까요? ${svg('arrowRight')}</button>`);}
function showRestart(){if(!history.length&&!won){toast('이미 처음 위치에 있어요.');return;}openSheet('restart',sheetHead('처음부터 다시 해볼까요?')+'<p class="confirm-text">현재 퍼즐의 이동 기록만 초기화돼요.<br>이전에 달성한 최고 기록과 별은 그대로 남아요.</p><button class="primary" data-action="confirm-restart">다시 시작</button><button class="secondary" data-action="close" style="margin-top:9px">계속 풀기</button>');}
function showWin(){

 const text=stars===3?'군더더기 없는 완벽한 경로였어요.':'막힌 길도, 한 칸씩 움직이면 열리죠.';
 openSheet('win',`<div class="win-content"><div class="win-art">${svg('flag')}</div><span class="eyebrow">STAGE ${String(levelIndex+1).padStart(2,'0')} COMPLETE</span><h2 id="sheet-title">${stars===3?'완벽하게 빠져나왔어요!':'드디어, 길이 열렸어요!'}</h2><p>${text}</p><div class="win-stars" aria-label="별 ${stars}개">${[0,1,2].map(i=>`<span class="${i<stars?'earned':''}">${svg('star')}</span>`).join('')}</div><div class="win-stats"><div class="win-stat">이번 이동<strong>${n}<small> 회</small></strong></div><div class="win-stat">최소 이동<strong>${p}<small> 회</small></strong></div></div><button class="primary" data-action="${last?'levels':'next'}">${last?'다른 스테이지 둘러보기':'다음 스테이지'} ${svg('arrowRight')}</button><div class="button-row"><button class="secondary" data-action="confirm-restart">한 번 더 풀기</button><button class="secondary" data-action="levels">스테이지 선택</button></div></div>`);

function celebrate(){if(reduced)return;const layer=document.createElement('div');layer.className='confetti';layer.setAttribute('aria-hidden','true');for(let i=0;i<25;i++){const p=document.createElement('i');p.style.setProperty('--x',`${Math.random()*100}%`);p.style.setProperty('--color',PALETTE[i%PALETTE.length]);p.style.setProperty('--delay',`${Math.random()*.45}s`);p.style.setProperty('--r',`${Math.random()*180}deg`);p.style.setProperty('--dx',`${Math.random()*140-70}px`);layer.appendChild(p);}document.body.appendChild(layer);setTimeout(()=>layer.remove(),2600);}
